title: Sushil Kumar M.S — Cyber Security Notes
description: Study notes, lab write-ups, and cert prep (CEH v13, Full Stack Cyber & Cloud Security)
theme: minima
minima:
  skin: dark
show_excerpts: true

# Collections let you group notes by course/cert instead of dumping
# everything into one blog feed.
collections:
  ceh:
    output: true
    permalink: /ceh/:path/
  networkers-home:
    output: true
    permalink: /networkers-home/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: ceh
    values:
      layout: post
  - scope:
      path: ""
      type: networkers-home
    values:
      layout: post

header_pages:
  - about.md

# Set this to your repo name if it's a project page
# (e.g. https://<username>.github.io/<repo-name>/)
# baseurl: "/cert-notes-blog"
url: ""
